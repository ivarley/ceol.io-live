<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ceol Listen — what it heard</title>
<style>
  :root {
    --bg: #12141a; --panel: #1a1d26; --line: #2a2f3d; --ink: #e6e9f0;
    --dim: #8b93a7; --heard: #4a9eff; --matched: #3ddc97; --truth: #b48ead;
    --playhead: #ff6b6b; --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
  h1 .type { color: var(--dim); font-weight: 400; }
  .meta { color: var(--dim); font-size: 12.5px; }
  .meta b { color: var(--ink); font-weight: 600; }
  .verdict { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 12px; }
  .ok { background: rgba(61,220,151,.15); color: var(--matched); }
  .bad { background: rgba(255,107,107,.15); color: var(--playhead); }
  main { padding: 14px 18px 28px; }
  .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 5px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--dim); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); }
  .time b { color: var(--ink); }
  label { color: var(--dim); display: inline-flex; align-items: center; gap: 6px; }
  canvas { display: block; width: 100%; border: 1px solid var(--line); border-radius: 6px;
           background: var(--panel); cursor: crosshair; }
  .legend { margin-top: 10px; color: var(--dim); font-size: 12.5px; display: flex; gap: 18px; flex-wrap: wrap; }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px;
            vertical-align: -1px; }
  section { margin-top: 22px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim);
       margin: 0 0 8px; font-weight: 600; }
  table { border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 3px 16px 3px 0; }
  th { color: var(--dim); font-weight: 600; }
  .truthrow { color: var(--matched); }
  .abc { color: var(--dim); word-break: break-all; line-height: 1.8; font-size: 12.5px; }
  .abc b { color: var(--matched); font-weight: 600; }
  @media (max-width: 700px) { main { padding: 12px; } header { padding: 12px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">—</h1>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="bar">
    <button id="play">▶ Play</button>
    <span class="time"><b id="cur">0:00</b> / <span id="dur">0:00</span></span>
    <label>speed
      <select id="rate">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
      </select>
    </label>
    <label><input type="checkbox" id="onlymatched"> dim unmatched notes</label>
    <span class="meta">click the roll to seek · space to play</span>
  </div>

  <canvas id="roll" height="420"></canvas>
  <div class="legend">
    <span><span class="swatch" style="background:var(--heard)"></span>note heard</span>
    <span><span class="swatch" style="background:var(--matched)"></span>part of a phrase the real tune also has</span>
    <span><span class="swatch" style="background:var(--playhead)"></span>playhead</span>
    <span id="octnote"></span>
  </div>

  <section>
    <h2>What the index made of it</h2>
    <table id="ranked"></table>
  </section>

  <section>
    <h2>The tune's own notation, for comparison</h2>
    <div class="abc" id="truthabc"></div>
  </section>
</main>

<audio id="audio" preload="auto"></audio>
<script>
const D = window.__DATA__;
const audio = document.getElementById('audio');
const canvas = document.getElementById('roll');
const ctx = canvas.getContext('2d');
let dpr = window.devicePixelRatio || 1;

audio.src = D.audio_url;

function fmt(s) {
  s = Math.max(0, s|0);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

document.getElementById('title').innerHTML =
  D.truth_name + ' <span class="type">' + (D.tune_type || '') + '</span>';
document.getElementById('meta').innerHTML =
  '<b>' + D.notes.length + '</b> notes heard over <b>' + fmt(D.duration_s) + '</b> · ' +
  'front end <b>' + D.frontend + '</b> · ' +
  'shares <b>' + D.shared_ngrams + '</b> of the tune\'s ' + D.n + '-note phrases · ' +
  'index rank ' + (D.truth_rank ? '<b>' + D.truth_rank + '</b>' : '<b>not found</b>') + ' ' +
  '<span class="verdict ' + (D.truth_rank === 1 ? 'ok' : 'bad') + '">' +
  (D.truth_rank === 1 ? 'correct' : 'wrong') + '</span>';
document.getElementById('octnote').textContent =
  'pitch axis ' + D.midi_lo + '–' + D.midi_hi + ' (MIDI)';

const rankedTable = document.getElementById('ranked');
rankedTable.innerHTML = '<tr><th>#</th><th>tune</th><th>score</th><th>hits</th></tr>' +
  D.ranked.map((r, i) =>
    '<tr class="' + (r.tune_id === D.truth_tune_id ? 'truthrow' : '') + '">' +
    '<td>' + (i + 1) + '</td><td>' + r.name + '</td>' +
    '<td>' + r.score.toFixed(4) + '</td><td>' + r.hits + '</td></tr>').join('');

document.getElementById('truthabc').innerHTML = D.truth_abc || '<i>no notation held for this tune</i>';

function resize() {
  dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = 420 * dpr;
  draw();
}

function draw() {
  const W = canvas.width, H = canvas.height, pad = 30 * dpr;
  const lo = D.midi_lo, hi = D.midi_hi;
  const dimUnmatched = document.getElementById('onlymatched').checked;
  ctx.clearRect(0, 0, W, H);

  const x = t => pad + (t / D.duration_s) * (W - pad * 1.4);
  const y = m => H - pad - ((m - lo) / Math.max(1, hi - lo)) * (H - pad * 2);

  // horizontal guides every octave, labelled
  ctx.font = (11 * dpr) + 'px ui-monospace, monospace';
  ctx.textBaseline = 'middle';
  for (let m = Math.ceil(lo / 12) * 12; m <= hi; m += 12) {
    ctx.strokeStyle = '#2a2f3d';
    ctx.lineWidth = 1 * dpr;
    ctx.beginPath(); ctx.moveTo(pad, y(m)); ctx.lineTo(W - pad * 0.4, y(m)); ctx.stroke();
    ctx.fillStyle = '#8b93a7';
    ctx.fillText('C' + (Math.floor(m / 12) - 1), 4 * dpr, y(m));
  }
  // time guides every 10s
  ctx.textBaseline = 'top';
  for (let t = 0; t <= D.duration_s; t += 10) {
    ctx.strokeStyle = '#232734';
    ctx.beginPath(); ctx.moveTo(x(t), pad * 0.6); ctx.lineTo(x(t), H - pad); ctx.stroke();
    ctx.fillStyle = '#8b93a7';
    ctx.fillText(fmt(t), x(t) + 3 * dpr, 6 * dpr);
  }

  for (const n of D.notes) {
    const x0 = x(n.t0), x1 = Math.max(x0 + 1.5 * dpr, x(n.t1));
    const yy = y(n.midi), h = Math.max(3 * dpr, (H - pad * 2) / Math.max(12, hi - lo) * 0.8);
    const matched = n.matched;
    ctx.globalAlpha = matched ? 1 : (dimUnmatched ? 0.18 : 0.75);
    ctx.fillStyle = matched ? '#3ddc97' : '#4a9eff';
    ctx.beginPath();
    const r = Math.min(2.5 * dpr, (x1 - x0) / 2);
    ctx.roundRect(x0, yy - h / 2, x1 - x0, h, r);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const t = audio.currentTime;
  ctx.strokeStyle = '#ff6b6b';
  ctx.lineWidth = 1.5 * dpr;
  ctx.beginPath(); ctx.moveTo(x(t), pad * 0.6); ctx.lineTo(x(t), H - pad); ctx.stroke();
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const pad = 30;
  const frac = (e.clientX - rect.left - pad) / (rect.width - pad * 1.4);
  audio.currentTime = Math.max(0, Math.min(D.duration_s, frac * D.duration_s));
  draw();
});

const playBtn = document.getElementById('play');
playBtn.addEventListener('click', () => audio.paused ? audio.play() : audio.pause());
audio.addEventListener('play', () => playBtn.textContent = '❚❚ Pause');
audio.addEventListener('pause', () => playBtn.textContent = '▶ Play');
audio.addEventListener('timeupdate', () => {
  document.getElementById('cur').textContent = fmt(audio.currentTime);
});
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('dur').textContent = fmt(audio.duration);
});
document.getElementById('rate').addEventListener('change', e => {
  audio.playbackRate = parseFloat(e.target.value);
});
document.getElementById('onlymatched').addEventListener('change', draw);
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    audio.paused ? audio.play() : audio.pause();
  }
});

function tick() { draw(); requestAnimationFrame(tick); }
window.addEventListener('resize', resize);
resize();
tick();
</script>
</body>
</html>
