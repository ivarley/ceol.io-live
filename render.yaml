# NOTE: every service here is dashboard-managed — Render does not apply this
# blueprint. Editing it changes nothing in production; it is documentation, and
# it is only useful if it stays true. (It previously claimed `flask run` on the
# free plan while production had been running gunicorn on starter for a long
# time, which sent a latency investigation chasing cold starts that weren't
# happening.) When you change a service in the dashboard, mirror it here.
#
# It has also gone wrong in the other direction: two cron jobs were ADDED here
# and never created, so the file asserted a weekly merge sync and a recording
# sweeper were running when neither had ever run. Adding a service here does not
# create it. Both are gone below, and the work they described now rides along on
# things that do exist. Nothing in this file should describe a service you have
# not seen in the dashboard.
#
# Last checked against the dashboard: 2026-08-19.
services:
  - type: web
    name: ceol.io-live
    env: python
    # Also builds the spec-024 live-logging Svelte bundle into static/live.
    buildCommand: "pip install -r requirements.txt && npm install && npm run build && cd frontend && npm install && npm run build"
    # The dashboard runs bare `gunicorn app:app`, and that is correct: gunicorn
    # loads ./gunicorn.conf.py from the working directory by default, so the
    # gthread settings apply without naming the file. Verified in the boot log
    # ("Using worker: gthread", two workers). See gunicorn.conf.py for why the
    # stock one-sync-worker default was the dominant source of page latency.
    #
    # post_fork also starts the spec-050 recording-ingest sweeper, which is why
    # there is no cron job for that. A worker booting IS the recovery event: the
    # only things that interrupt an ingest (deploy, OOM, max_requests recycle)
    # are all followed by a fork. This service is on starter and does not idle.
    startCommand: "gunicorn app:app"
    plan: starter
    envVars:
      # Pin Python explicitly — without this Render falls back to its legacy 3.7
      # default, where the spec-024 streaming deps (asyncpg/starlette/uvicorn) won't
      # install. Must match the streaming + cron services.
      - key: PYTHON_VERSION
        value: "3.11.0"
      # bits-ui (component kit, spec 035) requires Node >= 20; 22 is current LTS.
      # NOTE: the service is dashboard-managed, so what actually pins the build's
      # Node is the repo-root .nvmrc (no NODE_VERSION env var is set in the
      # dashboard). Keep this and .nvmrc in sync.
      - key: NODE_VERSION
        value: "22"
      # Public URL of the streaming sidecar (below), e.g. https://streaming.ceol.io
      - key: STREAMING_BASE_URL
        sync: false
      # Share the session cookie with the streaming subdomain (spec 024 §H).
      - key: SESSION_COOKIE_DOMAIN
        sync: false   # e.g. ".ceol.io"
      - key: SESSION_COOKIE_SECURE
        value: "true"

  # Live-logging SSE streaming sidecar (spec 024 §A4). Separate async service
  # (Starlette + asyncpg) holding the long-lived SSE connections; shares the DB
  # and the Flask session secret (cookie auth) with the main app.
  - type: web
    name: ceol-io-streaming
    env: python
    buildCommand: "pip install -r requirements.txt"
    # Bounded graceful drain: SIGTERM (deploy/restart) must not hang on the
    # infinite in-flight SSE streams. After 5s, drop them; clients auto-reconnect.
    startCommand: "uvicorn streaming.service:app --host 0.0.0.0 --port $PORT --timeout-graceful-shutdown 5"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGPORT
        value: "5432"
      - key: FLASK_SESSION_SECRET_KEY
        sync: false

  # The only cron job Ceol has, and the reason it stays that way: the weekly
  # thesession.org merge sync (spec 031) rides along at the end of this script
  # rather than as a second cron service. It gates itself on Monday 06:00 UTC
  # and on when it last ran, so 671 of every 672 invocations it costs one query.
  - type: cron
    name: ceol-io-active-sessions
    env: python
    schedule: "14,29,44,59 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 jobs/check_active_sessions.py"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PGHOST
        sync: false
      - key: PGDATABASE
        sync: false
      - key: PGUSER
        sync: false
      - key: PGPASSWORD
        sync: false
      - key: PGPORT
        value: "5432"

  - type: web
    name: abc-renderer
    runtime: node
    rootDir: abc-renderer
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: starter
    envVars:
      - key: NODE_VERSION
        value: "18"
      - key: PORT
        value: "10000"