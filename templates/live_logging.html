<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale=1 stops mobile browsers auto-zooming when a text field gains focus (app-like locked viewport) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Live Logging</title>
  <!--
    Spec 024 Phase 0 shell. Clean-slate: deliberately does NOT extend base.html.
    Bootstrap config is inlined for the self-contained Svelte bundle to read.
  -->
  <script>
    window.__LIVE_CONFIG__ = {
      sessionInstanceId: {{ session_instance_id | tojson }},
      sessionId: {{ session_id | tojson }},
      instanceDate: {{ instance_date | tojson }},
      instanceName: {{ instance_name | tojson }},
      instanceStartTime: {{ instance_start_time | tojson }},
      instanceEndTime: {{ instance_end_time | tojson }},
      sessionPath: {{ session_path | tojson }},
      streamingBaseUrl: {{ streaming_base_url | tojson }},
      currentPerson: {{ current_person | tojson }},
      canEdit: {{ can_edit | tojson }},
      instanceActive: {{ instance_active | tojson }},
      canonicalInstruments: {{ canonical_instruments | tojson }},
      trackAttendance: {{ track_attendance | tojson }},
      trackSetStarters: {{ track_set_starters | tojson }}
    };
    // Same app-wide flag base.html sets (this shell doesn't extend it): the tune drawer
    // and "Find a tune" overlay render for logged-out viewers too and have no page
    // payload of their own to ask.
    window.CEOL_AUTHED = {{ current_user.is_authenticated | tojson }};
  </script>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#0e0e10">
  <!-- Favicons (the live shell doesn't extend base.html, so mirror its icon links). -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='images/android-chrome-192x192.png') }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ url_for('static', filename='images/android-chrome-512x512.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
  <!-- Reuse the legacy tune-detail drawer verbatim (same module + styles + incipit
       rendering) so it matches the rest of the app exactly. url_for stamps every asset
       with its content-hash ?v= so the service workers can serve them cache-first. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tune_detail_modal.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='live/app.css') }}">
  <!-- The SAME app hamburger menu (shared partial/CSS/JS), rendered here and floated
       top-right over the Svelte header. Theme vars map the shared menu onto the live
       editor's always-dark palette. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/hamburger_menu.css') }}">
  <script src="{{ url_for('static', filename='js/hamburger_menu.js') }}"></script>
  <!-- The app-wide font (base.html loads the same family) — used by the replicated
       header's site title; body text stays the app's system stack. -->
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700&display=swap" rel="stylesheet">
  <style>
    .live-menu {
      --hamburger-line-color: #ececef;
      --dropdown-bg: #18181b; --dropdown-border: #2a2a30; --dropdown-shadow: rgba(0,0,0,0.55);
      --text-color: #ececef; --border-color: #2a2a30; --hover-bg: #23232c;
      --disabled-text: #9a9aa3; --bg-color: #0e0e10;
      /* In the 42px app header bar (the Svelte .appbar) at the base-layout header's
         measured hamburger position: 32px button at top 7, right inset 15. */
      position: fixed; top: calc(7px + env(safe-area-inset-top)); right: 15px; z-index: 50;
      font-family: 'Poppins', sans-serif; /* dropdown matches the app-wide menu */
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="live-menu">{% include 'hamburger_menu.html' %}</div>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
  <script src="{{ url_for('static', filename='js/mytunes_offline.js') }}"></script>
  <!-- Tune-detail sheet (Svelte, spec 035 Step 3): renders its own #tune-detail-modal
       container and installs window.TuneDetailModal for the logger's drawer. -->
  <script type="module" src="{{ url_for('static', filename='tunesheet/sheet.js') }}"></script>
  <script type="module" src="{{ url_for('static', filename='live/app.js') }}"></script>
</body>
</html>
