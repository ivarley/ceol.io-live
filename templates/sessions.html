{% extends "base.html" %}

{% block extra_css %}
{# Page styles are built with the Svelte bundle (frontend/src/sessionsdir/page.css)
   so the component is portable; same cascade position as the old <style> block. #}
<!-- The shared toolbar skin (spec 052 §B1): .filter-top-row / .filter-search-input /
     .filter-panel-toggle, worn by My Tunes and the session tabs. This page uses the
     same Toolbar, so it needs the same stylesheet — loaded BEFORE the page's own,
     which overrides it. -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/my_tunes_mobile.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='sessionsdir/page.css') }}">
{% endblock %}

{% block content %}
<div class="landing-page" style="display: block;">
    {# Spec 035 thin-shell invariant: this payload and GET /api/sessions/with-today-status
       are produced by ONE function (serializers.build_sessions_directory_payload). #}
    <script>
        window.__PAGE_DATA__ = {{ payload | tojson }};
        window.__IS_LOGGED_IN__ = {{ 'true' if is_logged_in else 'false' }};
    </script>
    <div id="sessions-root"></div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module" src="{{ url_for('static', filename='sessionsdir/page.js') }}"></script>
{% endblock %}
