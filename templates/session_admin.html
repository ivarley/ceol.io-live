{% extends "base.html" %}

{% block title %}Admin - {{ session.name }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/tune_detail_modal.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/session_instance_modal.css') }}">
{# Page styles are built with the Svelte bundle (frontend/src/sessionadminpage/page.css);
   linked after session_instance_modal.css to match the old <style>-block cascade order. #}
<link rel="stylesheet" href="{{ url_for('static', filename='sessionadminpage/page.css') }}">
{% endblock %}

{% block content %}
<div class="docs-content-inner">
    <div class="container">
        <article class="docs-article" id="section-1">
            {# Spec 035 thin-shell invariant: this payload and GET
               /api/admin/sessions/<path>/admin-detail are produced by ONE function
               (serializers.build_session_admin_payload), so the embed and the API
               cannot drift. The tab chrome and all page behavior live in the Svelte
               bundle mounted below; tab switching stays URL-based (the
               details/tunes/people/logs/cache wrapper routes render this same shell
               with a different active_tab). #}
            <script>
                window.__PAGE_DATA__ = {{ payload | tojson }};
                window.__PAGE_CTX__ = {{ {
                    'activeTab': active_tab,
                    'sessionPath': session_path,
                    'isSystemAdmin': current_user.is_system_admin
                } | tojson }};
            </script>
            <div id="session-admin-root"></div>
        </article>
    </div>
</div>

<!-- Session Instance Detail Modal (managed by static/js/session_instance_modal.js) -->
<div id="instance-detail-modal" class="instance-modal-overlay">
    <div class="instance-modal-dialog">
        <div id="instance-modal-content" class="instance-modal-content">
            <!-- Content will be dynamically populated by JavaScript -->
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/session_instance_modal.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='sessionadminpage/page.js') }}"></script>
{% endblock %}
