{# i18n-converted #}
{% extends "blog_base.html" %}

{% set tab_title = post.title %}
{% set page_description = post.summary %}

{% block blog_content %}
<article class="blog-post">
    <h1>{{ post.title }}</h1>
    <p class="blog-meta"><time datetime="{{ post.date.isoformat() }}">{{ post.date_label }}</time> · {{ post.author }}</p>
    <div class="blog-body">
        {% include post_body %}
    </div>
</article>

<nav class="blog-foot">
    <a href="{{ url_for('blog_index') }}">← {{ _('All posts') }}</a>
    <a href="{{ url_for('blog_rss', lang=lang if lang != 'en' else None) }}">{{ _('RSS feed') }}</a>
</nav>
{% endblock %}
