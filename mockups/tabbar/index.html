<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Ceol Tab Bar</title>
  <meta name="theme-color" content="#0f1012" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ceol" />
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <!-- 052 Tab-bar IA prototype. Desktop shows a phone frame; a phone fills the screen.
       Dummy data, no backend. Rationale: specs/changes/inprogress/052-native-ios-readiness.md §B -->
  <div class="phone" id="phone">
    <div class="appbar" id="appbar">
      <div class="left" id="bar-left"></div>
      <div class="title" id="bar-title">Tonight</div>
      <div class="right" id="bar-right"></div>
    </div>

    <div id="mount" class="mount"></div>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="grab"></div>
      <div class="sheet-head" id="sheet-head"></div>
      <div class="sheet-body" id="sheet-body"></div>
      <div class="sheet-foot" id="sheet-foot" hidden></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js?v=1"></script>
</body>
</html>
